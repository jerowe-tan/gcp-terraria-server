name: Terraria Server Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: Setup action
        required: true
        type: choice
        options:
          - install
          - create-world
          - install-and-create-world
          - verify
      world_name:
        description: World name (used for create-world actions)
        required: false
        default: TerrariaWorld
        type: string
      world_size:
        description: World size
        required: false
        default: medium
        type: choice
        options: [small, medium, large]
      difficulty:
        description: World difficulty
        required: false
        default: classic
        type: choice
        options: [classic, expert, master, journey]
      max_players:
        description: Maximum players
        required: false
        default: "8"
        type: string
      seed:
        description: Optional world seed
        required: false
        default: ""
        type: string
      start_server:
        description: Start Terraria after creating the world
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraria-server-setup
  cancel-in-progress: false

jobs:
  setup:
    name: ${{ inputs.action }} Terraria
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      VM_NAME: ${{ vars.VM_NAME }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      TERRARIA_VERSION: ${{ vars.TERRARIA_VERSION }}
      TERRARIA_INSTALL_DIR: ${{ vars.TERRARIA_INSTALL_DIR }}
      TERRARIA_LINUX_USER: ${{ vars.TERRARIA_LINUX_USER }}
      TERRARIA_PORT: ${{ vars.TERRARIA_PORT }}
      WORLD_NAME: ${{ inputs.world_name }}
      WORLD_SIZE: ${{ inputs.world_size }}
      WORLD_DIFFICULTY: ${{ inputs.difficulty }}
      MAX_PLAYERS: ${{ inputs.max_players }}
      WORLD_SEED: ${{ inputs.seed }}
      START_SERVER: ${{ inputs.start_server }}
      REMOTE_BUNDLE: /tmp/terraria-setup-${{ github.run_id }}.tgz
      REMOTE_DIR: /var/tmp/terraria-setup-${{ github.run_id }}
      REMOTE_PASSWORD_FILE: /tmp/terraria-password-${{ github.run_id }}.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          required=(GCP_PROJECT_ID GCP_ZONE VM_NAME GCP_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER TERRARIA_VERSION TERRARIA_INSTALL_DIR TERRARIA_LINUX_USER TERRARIA_PORT)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub repository variable: ${name}"
              exit 1
            fi
          done
          [[ "$TERRARIA_VERSION" =~ ^[0-9]+$ ]] || { echo "::error::TERRARIA_VERSION must contain digits only, for example 1458."; exit 1; }
          [[ "$TERRARIA_PORT" =~ ^[0-9]+$ ]] && (( TERRARIA_PORT >= 1 && TERRARIA_PORT <= 65535 )) || { echo "::error::TERRARIA_PORT must be between 1 and 65535."; exit 1; }

      - name: Validate world inputs
        if: inputs.action == 'create-world' || inputs.action == 'install-and-create-world'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$WORLD_NAME" =~ ^[A-Za-z0-9._[:space:]-]+$ ]]; then
            echo "::error::World name may contain letters, numbers, spaces, dots, underscores, and hyphens only."
            exit 1
          fi
          if [[ -n "$WORLD_SEED" && ! "$WORLD_SEED" =~ ^[A-Za-z0-9._[:space:]-]+$ ]]; then
            echo "::error::Seed may contain letters, numbers, spaces, dots, underscores, and hyphens only."
            exit 1
          fi
          [[ "$MAX_PLAYERS" =~ ^[0-9]+$ ]] && (( MAX_PLAYERS >= 1 && MAX_PLAYERS <= 255 )) || { echo "::error::Maximum players must be between 1 and 255."; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Check VM is running
        shell: bash
        run: |
          set -euo pipefail
          if ! STATUS="$(gcloud compute instances describe "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --format='value(status)')"; then
            echo "::error::Could not find or inspect VM '$VM_NAME' in zone '$GCP_ZONE'."
            exit 1
          fi
          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "::error::Terraria VM is not running (current state: $STATUS). Run 'Terraria Server Control' with action 'start' first."
            exit 1
          fi
          echo "VM '$VM_NAME' is RUNNING."

      - name: Test IAP and OS Login
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/iap-ssh-test.log"
          if ! gcloud compute ssh "$VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command='set -e; echo "IAP/OS Login connection successful"; echo "Remote user: $(whoami)"; sudo -n true; echo "sudo access successful"' \
            >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
            echo "::error::Could not connect through IAP/OS Login. Check OS Login, Compute OS Admin Login, IAP-Secured Tunnel User, Service Account User on the VM service account, and the IAP TCP 22 firewall rule."
            exit 1
          fi
          cat "$LOG_FILE"

      - name: Package setup files
        shell: bash
        run: |
          set -euo pipefail
          files=(scripts/install-terraria.sh scripts/configure-terraria.sh scripts/verify-terraria.sh systemd/terraria.service)
          for path in "${files[@]}"; do
            [[ -f "$path" ]] || { echo "::error::Required repository file is missing: $path"; exit 1; }
          done
          tar -czf "$RUNNER_TEMP/terraria-setup.tgz" "${files[@]}"

      - name: Copy setup files to VM
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp "$RUNNER_TEMP/terraria-setup.tgz" "${VM_NAME}:${REMOTE_BUNDLE}" \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap --quiet
          printf -v REMOTE_COMMAND 'sudo rm -rf %q && sudo install -d -m 0755 %q && sudo tar -xzf %q -C %q' \
            "$REMOTE_DIR" "$REMOTE_DIR" "$REMOTE_BUNDLE" "$REMOTE_DIR"
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"

      - name: Install Terraria
        if: inputs.action == 'install' || inputs.action == 'install-and-create-world'
        shell: bash
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND \
            'sudo env TERRARIA_VERSION=%q TERRARIA_INSTALL_DIR=%q TERRARIA_LINUX_USER=%q TERRARIA_PORT=%q bash %q %q' \
            "$TERRARIA_VERSION" "$TERRARIA_INSTALL_DIR" "$TERRARIA_LINUX_USER" "$TERRARIA_PORT" \
            "$REMOTE_DIR/scripts/install-terraria.sh" "$REMOTE_DIR/systemd/terraria.service"
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"

      - name: Copy optional Terraria password
        if: inputs.action == 'create-world' || inputs.action == 'install-and-create-world'
        shell: bash
        env:
          TERRARIA_PASSWORD: ${{ secrets.TERRARIA_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TERRARIA_PASSWORD:-}" ]]; then
            echo "No TERRARIA_PASSWORD secret is configured; the server will have no password."
            exit 0
          fi
          PASSWORD_FILE="$RUNNER_TEMP/terraria-password.txt"
          printf '%s' "$TERRARIA_PASSWORD" > "$PASSWORD_FILE"
          chmod 600 "$PASSWORD_FILE"
          gcloud compute scp "$PASSWORD_FILE" "${VM_NAME}:${REMOTE_PASSWORD_FILE}" \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap --quiet

      - name: Create and start world
        if: inputs.action == 'create-world' || inputs.action == 'install-and-create-world'
        shell: bash
        run: |
          set -euo pipefail
          START_VALUE=false
          [[ "$START_SERVER" == "true" ]] && START_VALUE=true
          printf -v REMOTE_COMMAND \
            'sudo env TERRARIA_INSTALL_DIR=%q TERRARIA_LINUX_USER=%q TERRARIA_PORT=%q WORLD_NAME=%q WORLD_SIZE=%q WORLD_DIFFICULTY=%q MAX_PLAYERS=%q WORLD_SEED=%q START_SERVER=%q PASSWORD_FILE=%q bash %q' \
            "$TERRARIA_INSTALL_DIR" "$TERRARIA_LINUX_USER" "$TERRARIA_PORT" "$WORLD_NAME" "$WORLD_SIZE" \
            "$WORLD_DIFFICULTY" "$MAX_PLAYERS" "$WORLD_SEED" "$START_VALUE" "$REMOTE_PASSWORD_FILE" \
            "$REMOTE_DIR/scripts/configure-terraria.sh"
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"

      - name: Verify Terraria server
        if: inputs.action == 'verify' || inputs.action == 'create-world' || inputs.action == 'install-and-create-world'
        shell: bash
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND \
            'sudo env TERRARIA_INSTALL_DIR=%q TERRARIA_LINUX_USER=%q TERRARIA_PORT=%q bash %q' \
            "$TERRARIA_INSTALL_DIR" "$TERRARIA_LINUX_USER" "$TERRARIA_PORT" "$REMOTE_DIR/scripts/verify-terraria.sh"
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"

      - name: Show connection details
        if: inputs.action == 'create-world' || inputs.action == 'install-and-create-world' || inputs.action == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_IP="$(gcloud compute instances describe "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"
          if [[ -n "$PUBLIC_IP" ]]; then
            echo "Terraria endpoint: ${PUBLIC_IP}:${TERRARIA_PORT}"
          else
            echo "::notice::The VM has no external IPv4 address."
          fi

      - name: Cleanup remote setup files
        if: always()
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet \
            --command="sudo rm -rf '$REMOTE_DIR' '$REMOTE_BUNDLE' '$REMOTE_PASSWORD_FILE'" \
            >/dev/null 2>&1 || true
