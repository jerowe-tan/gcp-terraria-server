name: Terraria Backup Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: Backup action
        required: true
        type: choice
        options: [install, enable, disable, backup-now, status]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraria-server-setup
  cancel-in-progress: false

jobs:
  setup:
    name: ${{ inputs.action }} Terraria backups
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      VM_NAME: ${{ vars.VM_NAME }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      TERRARIA_LINUX_USER: ${{ vars.TERRARIA_LINUX_USER }}
      REMOTE_BUNDLE: /tmp/terraria-backup-${{ github.run_id }}.tgz
      REMOTE_DIR: /var/tmp/terraria-backup-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          required=(GCP_PROJECT_ID GCP_ZONE VM_NAME GCP_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER TERRARIA_LINUX_USER)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub repository variable: ${name}"
              exit 1
            fi
          done
          [[ "$TERRARIA_LINUX_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::Invalid TERRARIA_LINUX_USER."; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Check VM is running
        shell: bash
        run: |
          set -euo pipefail
          if ! STATUS="$(gcloud compute instances describe "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --format='value(status)')"; then
            echo "::error::Could not find or inspect VM '$VM_NAME' in zone '$GCP_ZONE'."
            exit 1
          fi
          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "::error::Terraria VM is not running (current state: $STATUS). Run 'Terraria Server Control' with action 'start' first."
            exit 1
          fi
          echo "VM '$VM_NAME' is RUNNING."

      - name: Test IAP and OS Login
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/iap-ssh-test.log"
          if ! gcloud compute ssh "$VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command='set -e; echo "IAP/OS Login connection successful"; echo "Remote user: $(whoami)"; sudo -n true; echo "sudo access successful"' \
            >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
            echo "::error::Could not connect through IAP/OS Login. Check OS Login, Compute OS Admin Login, IAP-Secured Tunnel User, Service Account User on the VM service account, and the IAP TCP 22 firewall rule."
            exit 1
          fi
          cat "$LOG_FILE"

      - name: Package backup files
        if: inputs.action == 'install'
        shell: bash
        run: |
          set -euo pipefail
          files=(scripts/install-backup.sh scripts/backup-world-to-github.sh scripts/restore-world-from-github.sh systemd/terraria-world-backup.service systemd/terraria-world-backup.timer)
          for path in "${files[@]}"; do
            [[ -f "$path" ]] || { echo "::error::Required repository file is missing: $path"; exit 1; }
          done
          tar -czf "$RUNNER_TEMP/terraria-backup.tgz" "${files[@]}"

      - name: Copy backup files to VM
        if: inputs.action == 'install'
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp "$RUNNER_TEMP/terraria-backup.tgz" "${VM_NAME}:${REMOTE_BUNDLE}" \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap --quiet
          printf -v REMOTE_COMMAND 'sudo rm -rf %q && sudo install -d -m 0755 %q && sudo tar -xzf %q -C %q' \
            "$REMOTE_DIR" "$REMOTE_DIR" "$REMOTE_BUNDLE" "$REMOTE_DIR"
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"

      - name: Install backup tools
        if: inputs.action == 'install'
        shell: bash
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND \
            'sudo env TERRARIA_LINUX_USER=%q bash %q %q' \
            "$TERRARIA_LINUX_USER" "$REMOTE_DIR/scripts/install-backup.sh" "$REMOTE_DIR"
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command="$REMOTE_COMMAND"

      - name: Back up world now
        if: inputs.action == 'backup-now'
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command='sudo systemctl start terraria-world-backup.service'

      - name: Enable scheduled backups
        if: inputs.action == 'enable'
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet \
            --command='sudo systemctl start terraria-world-backup.service && sudo systemctl enable --now terraria-world-backup.timer'

      - name: Disable scheduled backups
        if: inputs.action == 'disable'
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --command='sudo systemctl disable --now terraria-world-backup.timer'

      - name: Show backup status
        if: inputs.action == 'status'
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet \
            --command='systemctl list-timers --all terraria-world-backup.timer; systemctl status terraria-world-backup.timer --no-pager || true; sudo journalctl -u terraria-world-backup.service -n 20 --no-pager'

      - name: Cleanup remote backup files
        if: always()
        shell: bash
        run: |
          set +e
          gcloud compute ssh "$VM_NAME" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet \
            --command="sudo rm -rf '$REMOTE_DIR' '$REMOTE_BUNDLE'" \
            >/dev/null 2>&1 || true
